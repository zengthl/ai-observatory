name: daily-fetch
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
      - name: Commit data snapshots
        run: |
          git config user.name "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No data changes today"
          else
            git commit -m "[data] $(date -u +%F)"
            git push
          fi
