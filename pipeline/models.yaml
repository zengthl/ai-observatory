# pipeline/models.yaml —— 模型身份主表（人工维护）
# 新模型名出现在 pending.json 时，在此登记后次日生效
#
# 规则：
# - 同一基础模型的不同推理档位后缀（-high/-low/-medium/max/fast 或 (high)/(medium) 括号变体）
#   映射到同一 model_id，由各适配器的 dedup 逻辑取最高分
# - 不同版本号（GLM-4.5 vs GLM-4.6 等）是不同条目，不合并
# - alias 归一化匹配由 resolveModelId 的小写去符号逻辑兜底，无需穷举大小写
#   （如 "GPT-5.6 Terra (medium)" 归一化为 gpt56terramedium）

